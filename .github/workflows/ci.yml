name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: |
          if [ -f tsconfig.json ]; then
            npx tsc --noEmit || true
          else
            echo "No tsconfig.json"
          fi

      - name: Verify main source files
        run: |
          test -f src/index.ts
          test -f src/commands/terabox.ts
          test -f src/commands/terabox-session.ts
          test -f src/services/terabox-session.ts
          test -f src/services/terabox-register.ts
          test -f src/services/terabox-scraper.ts
          test -f src/services/temp-email.ts
          test -f src/services/alerts.ts
          test -f src/services/proxy-manager.ts
          test -f src/services/user-agents.ts
          echo "Archivos principales OK"

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Test - proxy file loading
        run: npx tsx tests/proxy-manager.test.ts

      - name: Test - session save/load
        run: npx tsx tests/session.test.ts

      - name: Test - commands and utilities
        run: npx tsx tests/commands.test.ts

      - name: Test - WhatsApp connection flow (mocked, no real number)
        run: npx tsx tests/whatsapp-connection.mock.test.ts

      - name: Summary
        run: |
          echo "============================================"
          echo "CI completado"
          echo "- Proxies: lectura de sessions/proxies.txt validada"
          echo "- Sesión TeraBox: save/load/cookie header validados"
          echo "- Comandos: registro y handlers validados"
          echo "- WhatsApp: flujo de auth state validado SIN número real"
          echo "  (la vinculación real solo es posible fuera de CI)"
          echo "============================================"
